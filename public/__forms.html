<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <!-- Netlify Forms detects forms from static HTML at deploy time. This mirrors
         the React free-trial form in src/components/JoinCTA.js; keep field names in sync. -->
    <form name="free-trial" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="plan" />
      <input name="goal" />
    </form>
  </body>
</html>
